openapi: 3.1.0
info:
  title: Layers local API
  version: 1.0.0
  description: |-
    Authenticated local API for Layers project specifications.
    The server binds to loopback by default. Browser clients use an HttpOnly session
    cookie; local AI agents use bearer API tokens. Every project is private to its
    owner.
  license:
    name: Private local project
    url: https://example.com/private-license
servers:
  - url: http://127.0.0.1:3001/api/v1
security:
  - sessionCookie: []
  - bearerAuth: []
tags:
  - name: health
    description: API and database health.
  - name: auth
    description: Sign-in, sessions, accounts and API tokens.
  - name: users
    description: Super-admin user management.
  - name: projects
    description: Project catalog, metadata and lifecycle.
  - name: document
    description: Normalized project documents and optimistic concurrency.
  - name: activity
    description: Append-only project activity.
  - name: coverage
    description: Declaration-based verification coverage.
  - name: files
    description: Project export and import files.
paths:
  /health:
    get:
      tags:
        - health
      summary: Check the API and database
      responses:
        "200":
          description: API and database are available
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - version
                  - database
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                  database:
                    type: string
                    const: ok
        "503":
          $ref: "#/components/responses/Error"
      security: []
  /openapi.json:
    get:
      tags:
        - health
      summary: Return this OpenAPI document as JSON
      responses:
        "200":
          description: OpenAPI document
          content:
            application/json:
              schema:
                type: object
      security: []
  /projects:
    get:
      tags:
        - projects
      summary: List projects and the active project
      responses:
        "200":
          description: Project catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - projects
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Created project
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - projects
      summary: Read project metadata, guidelines and revisions
      responses:
        "200":
          description: Project detail
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - projects
      summary: Update metadata or test guidelines
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: Updated project
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - projects
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Project deleted and the next active project selected
          content:
            application/json:
              schema:
                type: object
                required:
                  - activeProjectId
                properties:
                  activeProjectId:
                    type:
                      - string
                      - "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/Conflict"
  /projects/{projectId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags:
        - projects
      summary: Duplicate a project
      responses:
        "201":
          description: Created duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
  /projects/{projectId}/activate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags:
        - projects
      summary: Set the active project
      responses:
        "200":
          description: Active project selected
          content:
            application/json:
              schema:
                type: object
                required:
                  - activeProjectId
                properties:
                  activeProjectId:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
  /projects/{projectId}/document:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - document
      summary: Read the normalized project document
      responses:
        "200":
          description: Project document
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags:
        - document
      summary: Replace the project document
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentWrite"
      responses:
        "200":
          description: Saved document with latest activity
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentWriteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{projectId}/activity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - activity
      summary: Read newest-first activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: before
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Activity history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - activity
      summary: Append an activity entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Activity appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{projectId}/coverage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - coverage
      summary: Read declaration-based verification coverage
      responses:
        "200":
          description: Coverage summary and rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coverage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
  /projects/{projectId}/export:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - files
      summary: Download a layers-project version 3 file
      responses:
        "200":
          description: Project export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
  /projects/import:
    post:
      tags:
        - files
      summary: Import a layers-project file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Imported project and repair issues
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                  - issues
                properties:
                  project:
                    $ref: "#/components/schemas/ProjectDetail"
                  issues:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      tags:
        - auth
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in and session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      tags:
        - auth
      summary: Sign out and clear the session cookie
      security: []
      responses:
        "204":
          description: Signed out
  /auth/session:
    get:
      tags:
        - auth
      summary: Read the current browser session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user and session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me:
    get:
      tags:
        - auth
      summary: Read the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/sessions:
    get:
      tags:
        - auth
      summary: List the current user sessions
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Browser sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - auth
      summary: Revoke all sessions except the current one
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Other sessions revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    delete:
      tags:
        - auth
      summary: Revoke one of the current user sessions
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
  /me/tokens:
    get:
      tags:
        - auth
      summary: List API tokens
      security:
        - sessionCookie: []
      responses:
        "200":
          description: API tokens without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - auth
      summary: Create an API token
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToken"
      responses:
        "201":
          description: Token created; the secret is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /me/tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    delete:
      tags:
        - auth
      summary: Revoke an API token
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
  /users:
    get:
      tags:
        - users
      summary: List users
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - users
      summary: Create a member user
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    patch:
      tags:
        - users
      summary: Enable or disable a user
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted revision returned by the last write or read.
      schema:
        type: string
        pattern: ^"\d+"$
        example: '"12"'
  headers:
    ETag:
      description: Quoted revision for the resource.
      schema:
        type: string
        pattern: ^"\d+"$
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource changed since it was loaded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many authentication attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    ProjectSummary:
      type: object
      required:
        - id
        - name
        - initials
        - color
        - description
        - createdAt
        - updatedAt
        - chapterCount
        - criterionCount
        - checkedCount
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
        color:
          type: string
          enum:
            - indigo
            - teal
            - amber
            - rose
            - violet
            - emerald
            - sky
            - slate
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        chapterCount:
          type: integer
        criterionCount:
          type: integer
        checkedCount:
          type: integer
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          required:
            - testGuidelines
            - metadataRevision
            - documentRevision
          properties:
            testGuidelines:
              type: string
            metadataRevision:
              type: integer
            documentRevision:
              type: integer
    ProjectList:
      type: object
      required:
        - projects
        - activeProjectId
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        activeProjectId:
          type:
            - string
            - "null"
    CreateProject:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
        name:
          type: string
          minLength: 1
          maxLength: 80
        initials:
          type: string
          maxLength: 2
        color:
          type: string
          enum:
            - indigo
            - teal
            - amber
            - rose
            - violet
            - emerald
            - sky
            - slate
        description:
          type: string
          maxLength: 280
        testGuidelines:
          type: string
          maxLength: 8000
    UpdateProject:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        initials:
          type: string
          maxLength: 2
        color:
          type: string
          enum:
            - indigo
            - teal
            - amber
            - rose
            - violet
            - emerald
            - sky
            - slate
        description:
          type: string
          maxLength: 280
        testGuidelines:
          type: string
          maxLength: 8000
    Verification:
      type: object
      required:
        - mode
        - auto
        - human
        - ai
      properties:
        mode:
          type: string
          enum:
            - auto
            - human
            - ai
        auto:
          type: object
          required:
            - command
          properties:
            command:
              type: string
              maxLength: 500
        human:
          type: object
          required:
            - instructions
          properties:
            instructions:
              type: string
              maxLength: 2000
        ai:
          type: object
          required:
            - instructions
          properties:
            instructions:
              type: string
              maxLength: 4000
    Criterion:
      type: object
      required:
        - id
        - text
        - checked
      properties:
        id:
          type: string
          maxLength: 128
        text:
          type: string
          maxLength: 20000
        checked:
          type: boolean
        chapterId:
          type: string
          maxLength: 128
    Chapter:
      type: object
      required:
        - id
        - parentId
        - title
        - description
        - finalLevel
        - verification
        - criteria
        - childIds
      properties:
        id:
          type: string
          maxLength: 128
        parentId:
          type:
            - string
            - "null"
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 100000
        finalLevel:
          type: boolean
        verification:
          $ref: "#/components/schemas/Verification"
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/Criterion"
        commits:
          type: array
          maxItems: 50
          description: >-
            Git commits that implemented the document, newest first. Hashes are
            lowercase 7-40 character hexadecimal strings. References only; they
            do not change criterion or verification state.
          items:
            type: string
            pattern: "^[0-9a-f]{7,40}$"
            maxLength: 40
        childIds:
          type: array
          items:
            type: string
    ChapterDocument:
      type: object
      required:
        - byId
        - rootIds
      properties:
        byId:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Chapter"
        rootIds:
          type: array
          items:
            type: string
    Document:
      type: object
      required:
        - schemaVersion
        - projectId
        - revision
        - updatedAt
        - chapters
        - selectedId
      properties:
        schemaVersion:
          type: integer
        projectId:
          type: string
        revision:
          type: integer
        updatedAt:
          type: string
          format: date-time
        chapters:
          $ref: "#/components/schemas/ChapterDocument"
        selectedId:
          type:
            - string
            - "null"
    ActivityInput:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
        chapterId:
          type:
            - string
            - "null"
        chapterName:
          type: string
          maxLength: 200
    DocumentWrite:
      type: object
      required:
        - chapters
        - selectedId
      properties:
        chapters:
          $ref: "#/components/schemas/ChapterDocument"
        selectedId:
          type:
            - string
            - "null"
        activity:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ActivityInput"
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    maxLength: 128
    ActivityEntry:
      type: object
      required:
        - id
        - message
        - chapterId
        - chapterName
        - time
      properties:
        id:
          type: string
        message:
          type: string
        chapterId:
          type:
            - string
            - "null"
        chapterName:
          type: string
        time:
          type: string
          format: date-time
        actorUserId:
          type:
            - string
            - "null"
        actorName:
          type:
            - string
            - "null"
    ActivityList:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
        nextBefore:
          type:
            - integer
            - "null"
    Stats:
      type: object
      required:
        - chapterCount
        - criterionCount
        - checkedCount
      properties:
        chapterCount:
          type: integer
        criterionCount:
          type: integer
        checkedCount:
          type: integer
    DocumentWriteResponse:
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          required:
            - stats
            - activity
          properties:
            stats:
              $ref: "#/components/schemas/Stats"
            activity:
              type: array
              items:
                $ref: "#/components/schemas/ActivityEntry"
    VerificationSummary:
      type: object
      required:
        - total
        - automated
        - human
        - ai
        - incompleteAuto
        - percent
      properties:
        total:
          type: integer
        automated:
          type: integer
        human:
          type: integer
        ai:
          type: integer
        incompleteAuto:
          type: integer
        percent:
          type: integer
    CoverageRow:
      type: object
      required:
        - chapterId
        - chapterTitle
        - chapterPath
        - mode
        - command
        - automated
        - incompleteAuto
        - criterionCount
        - checkedCount
        - commits
      properties:
        chapterId:
          type: string
        chapterTitle:
          type: string
        chapterPath:
          type: string
        mode:
          type: string
          enum:
            - auto
            - human
            - ai
        command:
          type: string
        automated:
          type: boolean
        incompleteAuto:
          type: boolean
        criterionCount:
          type: integer
        checkedCount:
          type: integer
        commits:
          type: array
          description: Commits linked to the chapter, newest first.
          items:
            type: string
            pattern: "^[0-9a-f]{7,40}$"
            maxLength: 40
    Coverage:
      type: object
      required:
        - summary
        - rows
        - testGuidelines
      properties:
        summary:
          $ref: "#/components/schemas/VerificationSummary"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CoverageRow"
        testGuidelines:
          type: string
    AuthUser:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - createdAt
        - updatedAt
        - disabledAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum:
            - super_admin
            - member
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        disabledAt:
          type:
            - string
            - "null"
          format: date-time
    SessionInfo:
      type: object
      required:
        - id
        - createdAt
        - lastSeenAt
        - expiresAt
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        userAgent:
          type:
            - string
            - "null"
        current:
          type: boolean
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
    LoginResponse:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        session:
          $ref: "#/components/schemas/SessionInfo"
    MeResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    SessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
    CreateUser:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 200
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    UpdateUser:
      type: object
      required:
        - disabled
      properties:
        disabled:
          type: boolean
    UserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    UsersResponse:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AuthUser"
    ApiTokenInfo:
      type: object
      required:
        - id
        - name
        - prefix
        - scopes
        - createdAt
        - lastUsedAt
        - expiresAt
        - revokedAt
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              - read
              - write
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
    CreateToken:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum:
              - read
              - write
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 3650
    CreateTokenResponse:
      type: object
      required:
        - token
        - tokenInfo
      properties:
        token:
          type: string
        tokenInfo:
          $ref: "#/components/schemas/ApiTokenInfo"
    TokensResponse:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenInfo"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: layers_session
      description: HttpOnly browser session cookie set by /auth/login.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: lrs_...
      description: API token created on the account page or via /me/tokens.
